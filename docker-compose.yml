services:
  coolify-ssl-healer:
    build: .
    container_name: coolify-ssl-healer
    restart: unless-stopped
    network_mode: host
    environment:
      SSL_APPLY: "${SSL_APPLY:-false}"
      SSL_CRITICAL_RESTART: "${SSL_CRITICAL_RESTART:-false}"
      HOST_RESERVE_MIB: "${HOST_RESERVE_MIB:-4096}"
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys/fs/cgroup:/host/cgroup:ro
      - guard-state:/state
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  resource-guard:
    build: .
    command: [python3, /app/resource_guard.py, watch]
    restart: unless-stopped
    environment:
      GUARD_APPLY: "${GUARD_APPLY:-false}"
      HOST_RESERVE_MIB: "${HOST_RESERVE_MIB:-4096}"
      INCUS_ENABLED: "false"
      INCUS_CONF: /tmp/incus
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys/fs/cgroup:/host/cgroup:ro
      - guard-state:/state
    logging:
      driver: json-file
      options:
        max-size: "16m"
        max-file: "8"

volumes:
  guard-state:
