services:
  coolify-ssl-healer:
    build: .
    container_name: coolify-ssl-healer
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/coolify:/data/coolify
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
